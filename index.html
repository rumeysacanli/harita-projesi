<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Diri Fay Hattı Haritası</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #harita {
            width: 100%;
            height: 100vh;
            background-color: #aad3df;
        }

        /* Lejant Tasarımı */
        .lejant-kutusu {
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .lejant-kutusu img {
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div id="harita"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        var map = L.map('harita', {
            center: [39.0, 35.0], // Koordinatlar
            zoom: 6, // Zoom Seviyesi
            minZoom: 5,
            maxBounds: [
                [30.0, 20.0],
                [45.0, 50.0]
            ],
            maxBoundsViscosity: 1.0
        });

        // YENİ TEMİZ ALTLIK HARİTA (Deniz sınırlarını göstermeyen Esri haritası)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            noWrap: true,
            attribution: '© Esri'
        }).addTo(map);

        // DİRİ FAY HATLARI WMS KATMANI
        var tucbsLinki = "https://mtayenicbs-geoserver.mta.gov.tr/geoserver/mta/wms";

        L.tileLayer.wms(tucbsLinki, {
            layers: 'mta:DRYGEO2', // Katman adı
            format: 'image/png',
            transparent: true,
            version: '1.1.1'
        }).addTo(map);

        // SAĞ ALTA RENK AÇIKLAMALARI (LEJANT) EKLEME
        var lejant = L.control({ position: 'bottomright' });

        lejant.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'lejant-kutusu');
            var lejantGorseli = "https://mtayenicbs-geoserver.mta.gov.tr/geoserver/wms?request=GetLegendGraphic&version=1.1.1&format=image/png&layer=mta:DRYGEO2";
            div.innerHTML = '<strong>Açıklamalar</strong><br><img src="' + lejantGorseli + '" alt="Fay Hatları Lejantı">';
            return div;
        };

        lejant.addTo(map);
    </script>

</body>

</html>
